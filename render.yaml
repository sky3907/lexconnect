services:
  - type: web
    name: lexconnect-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
    disk:
      name: lexconnect-db
      mountPath: /data
      sizeGB: 1